      ctx.fillStyle = l.user ? col : "rgba(11,12,15,.85)"; ctx.fillRect(x, y - 8, tw, 16);
      if (!l.user) { ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y - 7.5, tw - 1, 15); }
      ctx.fillStyle = l.user ? "#05110c" : col; ctx.textAlign = "left"; ctx.fillText(text, x + 5, y + 0.5);
      if (l.user && l.side === "short") { ctx.fillStyle = "#fff"; ctx.fillText(text, x + 5, y + 0.5); }
    }
  },

  lastLine(ctx, g) {
    if (!isFinite(Hub.lastPx)) return;
    const y = Math.round(this.p2y(Hub.lastPx, g)) + 0.5;
    ctx.strokeStyle = Hub.lastSide > 0 ? "rgba(34,195,142,.8)" : "rgba(255,90,95,.8)"; ctx.setLineDash([2, 3]);
    ctx.beginPath(); ctx.moveTo(g.x0, y); ctx.lineTo(g.x1, y); ctx.stroke(); ctx.setLineDash([]);
  },

  crosshair(ctx, g) {
    const m = this.mouse; if (!m || m.x > g.x1 || m.y > g.y1) return;
    ctx.strokeStyle = "rgba(200,205,215,.25)"; ctx.beginPath();
    ctx.moveTo(m.x + 0.5, g.y0); ctx.lineTo(m.x + 0.5, g.y1); ctx.moveTo(g.x0, m.y + 0.5); ctx.lineTo(g.x1, m.y + 0.5); ctx.stroke();
  },

  priceAxis(ctx, g) {
    ctx.fillStyle = "#0b0c0f"; ctx.fillRect(g.x1, 0, g.axisW, this.H);
    ctx.strokeStyle = "#23272d"; ctx.beginPath(); ctx.moveTo(g.x1 + 0.5, 0); ctx.lineTo(g.x1 + 0.5, this.H); ctx.stroke();
    const step = this._pStep || 1; const dec = decimalsFor(step);
    const pLo = this.y2p(g.y1, g) + S.displayOffset, pHi = this.y2p(g.y0, g) + S.displayOffset;
    ctx.fillStyle = "#8a919b"; ctx.font = "11px ui-monospace,Consolas,monospace"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    for (let p = Math.ceil(pLo / step) * step; p <= pHi; p += step) ctx.fillText(p.toFixed(dec), g.x1 + 6, this.p2y(p - S.displayOffset, g));
    const tag = (p, bg, fg) => { const y = this.p2y(p, g); if (y < g.y0 || y > g.y1) return; ctx.fillStyle = bg; ctx.fillRect(g.x1 + 1, y - 8, g.axisW - 1, 16); ctx.fillStyle = fg; ctx.fillText((p + S.displayOffset).toFixed(2), g.x1 + 6, y); };
    if (this._prof && S.ov.profile) tag(this._prof.poc, "#3a3214", "#f3d77a");
    if (S.ov.levels) for (const u of Levels.user) tag(u.price - S.displayOffset, u.side === "long" ? "#0f5e44" : u.side === "short" ? "#7a2326" : "#1f3d78", "#fff");
    if (isFinite(Hub.lastPx)) tag(Hub.lastPx, Hub.lastSide > 0 ? "#127a58" : "#a3363a", "#fff");
    if (this.mouse && this.mouse.y < g.y1 && this.mouse.x < g.x1) tag(this.y2p(this.mouse.y, g), "#2f343b", "#fff");
  },

  timeAxis(ctx, g, t0, t1) {
    const y = this.H - g.timeH;
    ctx.fillStyle = "#0b0c0f"; ctx.fillRect(0, y, this.W, g.timeH);
    ctx.strokeStyle = "#23272d"; ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(this.W, y + 0.5); ctx.stroke();
    const steps = [1e3, 5e3, 15e3, 30e3, 60e3, 300e3, 900e3, 1800e3, 3600e3, 7200e3, 14400e3];
    const need = 90 * this.view.msPerPx; const st = steps.find(s => s >= need) || 14400e3;
    ctx.fillStyle = "#8a919b"; ctx.font = "11px ui-monospace,Consolas,monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (let t = Math.ceil(t0 / st) * st; t <= t1; t += st) { const x = this.t2x(t, g); ctx.fillText(fmtTime(t, st < 60e3), x, y + g.timeH / 2); ctx.fillStyle = "#111419"; ctx.fillRect(x, g.y0, 1, g.y1 - g.y0); ctx.fillStyle = "#8a919b"; }
    if (this.mouse && this.mouse.x < g.x1) { const x = this.mouse.x, tt = this.x2t(x, g); ctx.fillStyle = "#2f343b"; ctx.fillRect(x - 36, y + 2, 72, g.timeH - 4); ctx.fillStyle = "#fff"; ctx.fillText(fmtTime(tt, true), x, y + g.timeH / 2); }
  },

  cvd(ctx, g, cs) {
    const y0 = g.cvdY0, y1 = g.cvdY1;
    ctx.fillStyle = "#090a0d"; ctx.fillRect(0, y0, g.x1, y1 - y0);
    ctx.strokeStyle = "#23272d"; ctx.beginPath(); ctx.moveTo(0, y0 + 0.5); ctx.lineTo(this.W, y0 + 0.5); ctx.stroke();
    if (!cs.length) return;
    // CVD over visible range + per-candle delta bars
    let cum = 0; const pts = []; let mn = 0, mx = 0, md = 1;
    for (const c of cs) { const d = c.buy - c.sell; cum += d; pts.push([c, cum, d]); if (cum < mn) mn = cum; if (cum > mx) mx = cum; if (Math.abs(d) > md) md = Math.abs(d); }
    const mid = (y0 + y1) / 2, half = (y1 - y0) / 2 - 6;
    const cw = S.tf / this.view.msPerPx;
    for (const [c, , d] of pts) { const x = this.t2x(c.t, g); const h = d / md * half * 0.9; ctx.fillStyle = d >= 0 ? "rgba(34,195,142,.35)" : "rgba(255,90,95,.35)"; ctx.fillRect(x + cw * 0.15, mid - Math.max(0, h), Math.max(1, cw * 0.7), Math.abs(h)); }
    const sc = (v) => y1 - 6 - (v - mn) / ((mx - mn) || 1) * (y1 - y0 - 12);
    ctx.strokeStyle = "#f3d77a"; ctx.lineWidth = 1.4; ctx.beginPath();
    pts.forEach(([c, v], i) => { const x = this.t2x(c.t + S.tf, g); if (i) ctx.lineTo(x, sc(v)); else ctx.moveTo(x, sc(v)); }); ctx.stroke();
    ctx.fillStyle = "#6c737d"; ctx.font = "10px ui-monospace,Consolas,monospace"; ctx.textAlign = "left"; ctx.fillText("CVD (visible) " + fmtVol(cum), 6, y0 + 10);
    ctx.fillStyle = "#0b0c0f"; ctx.fillRect(g.x1, y0, g.axisW, y1 - y0);
  },

  ladder() {
    const c = this.lc, ctx = c.getContext("2d");
    const W = c.width / this.dpr, H = c.height / this.dpr;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.fillStyle = "#0e1013"; ctx.fillRect(0, 0, W, H);
    const H0 = Hub.heat[Hub.heat.length - 1];
    if (!H0 || !isFinite(Hub.lastPx)) { ctx.fillStyle = "#5a616b"; ctx.font = "11px system-ui"; ctx.textAlign = "center"; ctx.fillText("waiting for book", W / 2, 30); return; }
    const row = Math.max(Candles.row || 0.25, S.heatBin);
    const rowH = 15; const n = Math.floor((H - 26) / rowH);
    const center = Math.floor(Hub.lastPx / row);
    const rTop = center + Math.floor(n / 2);
    // aggregate book at ladder row size
    const lv = new Map();
    for (let i = 0; i < H0.bins.length; i++) { const v = H0.bins[i]; if (!v) continue; const p = (H0.base + i) * S.heatBin; const r = Math.floor(p / row + 1e-7); lv.set(r, (lv.get(r) || 0) + v); }
    // traded volume at price, last 5 min
    let tv = this._tv;
    if (!tv || Date.now() - this._tvT > 500 || this._tvRow !== row) { tv = this._tv = new Map(); this._tvT = Date.now(); this._tvRow = row; } else tv = null;
    const i0 = store.lowerBound(Date.now() - 300e3);
    if (tv) for (let i = i0; i < store.n; i++) { const r = Math.floor(store.p[i] / row + 1e-7); let e = tv.get(r); if (!e) { e = [0, 0]; tv.set(r, e); } if (store.d[i] > 0) e[1] += store.s[i]; else e[0] += store.s[i]; }
    tv = this._tv;
    let maxB = 1, maxT = 1; for (let k = 0; k < n; k++) { const r = rTop - k; maxB = Math.max(maxB, lv.get(r) || 0); const e = tv.get(r); if (e) maxT = Math.max(maxT, e[0] + e[1]); }
    const big = pctile([...lv.values()], 0.97);
    ctx.font = "10.5px ui-monospace,Consolas,monospace"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#5a616b"; ctx.textAlign = "left"; ctx.fillText("BOOK", 6, 10); ctx.textAlign = "center"; ctx.fillText("PRICE", W * 0.5, 10); ctx.textAlign = "right"; ctx.fillText("5m TRADED", W - 6, 10);
    const dec = decimalsFor(row);
    for (let k = 0; k < n; k++) {
      const r = rTop - k, y = 22 + k * rowH, p = r * row;
      const isAsk = isFinite(H0.ba) ? p >= Math.floor(H0.ba / row) * row : p > Hub.lastPx;
      const isBid = isFinite(H0.bb) ? p <= Math.floor(H0.bb / row) * row : p < Hub.lastPx;
      const v = lv.get(r) || 0;
      if (r === Math.floor(Hub.lastPx / row)) { ctx.fillStyle = "#2a2410"; ctx.fillRect(0, y, W, rowH - 1); }
      const bw = (v / maxB) * (W * 0.42);
      ctx.fillStyle = isAsk ? "rgba(255,90,95,.35)" : isBid ? "rgba(34,195,142,.35)" : "rgba(160,160,160,.2)";
      ctx.fillRect(0, y + 1, bw, rowH - 3);
      ctx.fillStyle = v >= big && v > 0 ? "#f3d77a" : "#aab1bb"; ctx.textAlign = "left"; if (v) ctx.fillText(fmtVol(v), 4, y + rowH / 2);
      ctx.fillStyle = "#d9dde3"; ctx.textAlign = "center"; ctx.fillText((p + S.displayOffset).toFixed(dec), W * 0.52, y + rowH / 2);
      const e = tv.get(r);
      if (e) {
        const tw = ((e[0] + e[1]) / maxT) * (W * 0.32); const fb = e[0] / (e[0] + e[1]);
        ctx.fillStyle = "rgba(255,90,95,.45)"; ctx.fillRect(W - tw, y + 1, tw * fb, rowH - 3);
        ctx.fillStyle = "rgba(34,195,142,.45)"; ctx.fillRect(W - tw + tw * fb, y + 1, tw * (1 - fb), rowH - 3);
        ctx.fillStyle = "#aab1bb"; ctx.textAlign = "right"; ctx.fillText(fmtVol(e[0] + e[1]), W - 4, y + rowH / 2);
      }
    }
  },
};

// ─────────────────────────────── UI
const UI = {
  venuesDirty: true, sigDirty: true, _msgT: 0, audio: null,
  init() {
    const bindSeg = (gid, get, set) => {
      const g = $(gid);
      const sync = () => g.querySelectorAll(".seg").forEach(b => b.classList.toggle("on", get(b.dataset.v)));
      g.addEventListener("click", e => { const b = e.target.closest(".seg"); if (!b) return; set(b.dataset.v); saveSettings(); sync(); R.dirty = true; });
      sync();
    };
    bindSeg("gMode", v => S.mode === v, v => S.mode = v);
    bindSeg("gTf", v => +v === S.tf, v => {
      S.tf = +v; Candles.autoRow = 0; Candles.invalidate();
      const vw = R.view; vw.msPerPx = clamp(S.tf / clamp(R.W / 7, 45, 120), 20, 60000);
      vw.follow = true; vw.autoY = true; vw.mid = NaN; vw.pxPerUsd = NaN; R._heatKey = null;
    });
    bindSeg("gCell", v => S.cell === v, v => S.cell = v);
    bindSeg("gOv", v => !!S.ov[v], v => { S.ov[v] = !S.ov[v]; if (v === "signals") Signals.rebuild(); });
    $("selRow").value = String(S.row);
    $("selRow").onchange = e => { S.row = e.target.value; saveSettings(); Candles.invalidate(); };
    $("btnFollow").onclick = () => { R.view.follow = true; R.view.autoY = true; R.dirty = true; };
    $("btnSettings").onclick = () => this.settings();
    $("btnHelp").onclick = () => this.help();
    $("btnAddLv").onclick = () => this.levelsDialog();
    $("btnSound").onclick = () => { S.sound = !S.sound; saveSettings(); this.syncSound(); if (S.sound) this.beep(1); };
    this.syncSound();
    $("modal").onclick = e => { if (e.target.id === "modal") $("modal").classList.remove("on"); };
    this.buildVenues();
    this.interactions();
    window.addEventListener("resize", () => R.layout());
    document.addEventListener("keydown", e => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
      const k = e.key.toLowerCase();
      const v = R.view;
      if (k === "+" || k === "=") { v.msPerPx = clamp(v.msPerPx / 1.25, 5, 600000); R.dirty = true; e.preventDefault(); return; }
      if (k === "-" || k === "_") { v.msPerPx = clamp(v.msPerPx * 1.25, 5, 600000); R.dirty = true; e.preventDefault(); return; }
      if (k === "arrowup") { v.autoY = false; v.pxPerUsd = clamp(v.pxPerUsd * 1.2, 0.05, 4000); R.dirty = true; e.preventDefault(); return; }
      if (k === "arrowdown") { v.autoY = false; v.pxPerUsd = clamp(v.pxPerUsd / 1.2, 0.05, 4000); R.dirty = true; e.preventDefault(); return; }
      if (k === "arrowleft" || k === "arrowright") { v.follow = false; v.right += (k === "arrowleft" ? -1 : 1) * 80 * v.msPerPx; R.dirty = true; e.preventDefault(); return; }
      if (k === "a") { v.autoY = !v.autoY; R.dirty = true; return; }
      if (k === "f") S.mode = "footprint"; else if (k === "h") S.mode = "heatmap"; else if (k === "b") S.mode = "both"; else if (k === " ") { R.view.follow = true; R.view.autoY = true; } else return;
      e.preventDefault(); saveSettings(); this.reSync(); R.dirty = true;
    });
  },
  reSync() { for (const id of ["gMode", "gTf", "gCell", "gOv"]) $(id).querySelectorAll(".seg").forEach(b => { const v = b.dataset.v; b.classList.toggle("on", id === "gMode" ? S.mode === v : id === "gTf" ? +v === S.tf : id === "gCell" ? S.cell === v : !!S.ov[v]); }); },
  syncSound() { $("btnSound").textContent = S.sound ? "🔊 on" : "🔈 off"; },
  buildVenues() {
    const box = $("venues"); box.innerHTML = "";
    for (const k of PRIORITY) {
      const f = FEEDS[k];
      const el = document.createElement("label"); el.className = "venue";
      el.innerHTML = `<input type="checkbox" ${S.venues[k] ? "checked" : ""}><span><span class="dot" data-k="${k}"></span>${f.name} <span style="color:var(--faint);font-size:10.5px">${k === "demo" ? "synthetic" : S.sym[k]}</span></span><span class="st" data-st="${k}"></span>`;
      el.querySelector("input").onchange = e => { S.venues[k] = e.target.checked; saveSettings(); if (e.target.checked) f.start(); else f.stop(); Hub.primary = null; };
      box.appendChild(el);
    }
  },
  renderVenues() {
    if (!this.venuesDirty) return; this.venuesDirty = false;
    let any = false, errs = 0;
    for (const k of PRIORITY) {
      const f = FEEDS[k];
      const d = document.querySelector(`.dot[data-k="${k}"]`), st = document.querySelector(`[data-st="${k}"]`);

  updateStats(cs) {

    // session = since 18:00 New York

    const offs = new Date(now) - ny; const s = new Date(ny); s.setHours(18, 0, 0, 0); if (ny < s) s.setDate(s.getDate() - 1);
    const sessStart = s.getTime() + offs;
    if (!this._statT || now - this._statT > 1000) {
      this._statT = now;

      let vol = 0, buy = 0; for (const c of cs2) { vol += c.vol; buy += c.buy; }
      $("kVol").textContent = fmtVol(vol); const dl = 2 * buy - vol; $("kDelta").textContent = (dl >= 0 ? "+" : "") + fmtVol(dl); $("kDelta").style.color = dl >= 0 ? "var(--buy)" : "var(--sell)";

      for (const [r, v] of prof) { tot += v; if (v > pv) { pv = v; poc = r; } }
      if (poc !== null) {
        const keys = [...prof.keys()].sort((a, b) => a - b); let lo = keys.indexOf(poc), hi = lo, acc = pv;
        while (acc < tot * 0.7 && (lo > 0 || hi < keys.length - 1)) { const up = hi < keys.length - 1 ? prof.get(keys[hi + 1]) : -1, dn = lo > 0 ? prof.get(keys[lo - 1]) : -1; if (up >= dn) { hi++; acc += up; } else { lo--; acc += dn; } }

  interactions() {
    const cv = R.cv; let drag = null; let pinch = null;
    const pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    // where is the pointer: price axis (right), time axis (bottom) or the chart
    const zone = p => { const g = R.geom(); return p.x > g.x1 ? "price" : p.y > R.H - g.timeH ? "time" : "chart"; };
    cv.addEventListener("pointerdown", e => {
      cv.setPointerCapture(e.pointerId); const p = pos(e);
      drag = { ...p, right: R.view.right, mid: R.view.mid, ppu: R.view.pxPerUsd, mpp: R.view.msPerPx, zone: zone(p) };
    });
    cv.addEventListener("pointermove", e => {
      const p = pos(e); R.mouse = p; R.dirty = true;
      const z = drag ? drag.zone : zone(p);
      cv.style.cursor = z === "price" ? "ns-resize" : z === "time" ? "ew-resize" : drag ? "grabbing" : "crosshair";
      if (z === "chart") this.tooltip(p); else $("tip").style.display = "none";
      if (!drag || pinch) return;
      const g = R.geom();
      if (drag.zone === "price") { // drag price scale: up = stretch, down = squeeze (like TradingView)
        R.view.autoY = false; R.view.pxPerUsd = clamp(drag.ppu * Math.exp((drag.y - p.y) * 0.008), 0.05, 4000); return;
      }
      if (drag.zone === "time") { // drag time scale: right = stretch candles, left = squeeze
        const xr = g.x1, tR = R.view.right;
        R.view.msPerPx = clamp(drag.mpp * Math.exp((drag.x - p.x) * 0.008), 5, 600000);
        if (!R.view.follow) R.view.right = tR;
        return;
      }
      R.view.follow = false; R.view.autoY = false;
      R.view.right = drag.right - (p.x - drag.x) * R.view.msPerPx;
      R.view.mid = drag.mid + (p.y - drag.y) / R.view.pxPerUsd;
    });
    cv.addEventListener("pointerup", () => { drag = null; });
    cv.addEventListener("pointerleave", () => { R.mouse = null; $("tip").style.display = "none"; R.dirty = true; });
    cv.addEventListener("dblclick", e => {
      const z = zone(pos(e));
      if (z === "price") R.view.autoY = true;                                   // double-click price scale = auto-fit price
      else if (z === "time") R.view.msPerPx = clamp(S.tf / clamp(R.W / 7, 45, 120), 20, 60000); // = reset candle width
      else { R.view.follow = true; R.view.autoY = true; }
      R.dirty = true;
    });
    cv.addEventListener("wheel", e => {
      e.preventDefault(); const p = pos(e); const g = R.geom();
      // trackpad two-finger sideways swipe = scroll through time
      if (Math.abs(e.deltaX) > Math.abs(e.deltaY) && !e.ctrlKey) { R.view.follow = false; R.view.right += e.deltaX * R.view.msPerPx; R.dirty = true; return; }
      const f = Math.exp(e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)); // ctrl+wheel = trackpad pinch
      if (e.shiftKey || e.altKey || p.x > g.x1) {
        R.view.autoY = false; const price = R.y2p(p.y, g); R.view.pxPerUsd = clamp(R.view.pxPerUsd / f, 0.05, 4000);
        R.view.mid = price + S.displayOffset + (p.y - (g.y0 + g.y1) / 2) / R.view.pxPerUsd;
      } else {
        const t = R.x2t(p.x, g); R.view.msPerPx = clamp(R.view.msPerPx * f, 5, 600000);
        if (!R.view.follow) R.view.right = t + (g.x1 - p.x) * R.view.msPerPx;
      }
      R.dirty = true;
    }, { passive: false });
    // touch: two-finger pinch zooms time (sideways) and price (up/down); double-tap = back to live
    let lastTap = 0;
    cv.addEventListener("touchstart", e => {
      if (e.touches.length === 2) {
        drag = null;
        const [a, b] = e.touches;
        pinch = { dx: Math.max(20, Math.abs(a.clientX - b.clientX)), dy: Math.max(20, Math.abs(a.clientY - b.clientY)), m: R.view.msPerPx, ppu: R.view.pxPerUsd };
      }
    }, { passive: true });
    cv.addEventListener("touchmove", e => {
      if (pinch && e.touches.length === 2) {
        e.preventDefault();
        const [a, b] = e.touches;
        const dx = Math.max(20, Math.abs(a.clientX - b.clientX)), dy = Math.max(20, Math.abs(a.clientY - b.clientY));
        if (pinch.dx > 40 || dx > 40) R.view.msPerPx = clamp(pinch.m * pinch.dx / dx, 5, 600000);
        if (Math.abs(dy - pinch.dy) > 12) { R.view.autoY = false; R.view.pxPerUsd = clamp(pinch.ppu * dy / pinch.dy, 0.05, 4000); }
        R.dirty = true;
      }
    }, { passive: false });
    cv.addEventListener("touchend", e => {
      if (e.touches.length < 2) pinch = null;
      if (e.touches.length === 0 && e.changedTouches.length === 1) {
        const now = Date.now();
        if (now - lastTap < 300) { R.view.follow = true; R.view.autoY = true; R.dirty = true; lastTap = 0; } else lastTap = now;
        setTimeout(() => { $("tip").style.display = "none"; R.mouse = null; R.dirty = true; }, 1800);
      }
    });
    // on-chart zoom buttons (all devices)
    $("zoomBar").addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      const z = b.dataset.z, v = R.view;
      if (z === "t+") v.msPerPx = clamp(v.msPerPx / 1.4, 5, 600000);
      if (z === "t-") v.msPerPx = clamp(v.msPerPx * 1.4, 5, 600000);
      if (z === "p+") { v.autoY = false; v.pxPerUsd = clamp(v.pxPerUsd * 1.4, 0.05, 4000); }
      if (z === "p-") { v.autoY = false; v.pxPerUsd = clamp(v.pxPerUsd / 1.4, 0.05, 4000); }
      if (z === "live") { v.follow = true; v.autoY = true; }
      if (z === "auto") { v.autoY = !v.autoY; }
      R.dirty = true;
    });
    // slide-out panels on small screens
    const togglePanel = (on) => { $("side").classList.toggle("open", on); $("scrim").classList.toggle("on", on); };
    $("btnPanel").onclick = () => togglePanel(!$("side").classList.contains("open"));
    $("scrim").onclick = () => togglePanel(false);
  },
  tooltip(p) {

    $("s_csv").onclick = () => this.exportCsv();
    $("s_notif").onclick = () => { if ("Notification" in window) Notification.requestPermission(); };
    $("s_save").onclick = () => {
      const old = JSON.stringify(S.sym);
      for (const k of ["binance", "hyperliquid", "bybit", "okx", "kraken"]) S.sym[k] = $("s_" + k).value.trim();
      S.aggregate = $("s_agg").value === "1";
      const num = (id, k) => { const x = parseFloat($(id).value); if (isFinite(x)) S[k] = x; };
      num("s_bf", "backfillHours"); num("s_keep", "keepHours"); num("s_off", "displayOffset"); num("s_snap", "snapMs");
      num("s_con", "heatContrast"); num("s_bmin", "bubbleMin"); num("s_bsc", "bubbleScale");
      num("s_imb", "imbRatio"); num("s_imbm", "imbMin"); num("s_stk", "stackN"); num("s_abs", "absorbX"); num("s_exh", "exhaustPct"); num("s_div", "divLook");
      S.heatLog = $("s_log").value === "1";
      saveSettings();
      if (old !== JSON.stringify(S.sym)) { for (const k of PRIORITY) if (S.venues[k]) { FEEDS[k].stop(); FEEDS[k].start(); } this.buildVenues(); }
      restartSnap(); Signals.rebuild(); this.venuesDirty = true; R.dirty = true;
      $("modal").classList.remove("on");
    };
    $("modal").classList.add("on");
  },
  exportCsv() {
    const g = R.geom(); const cs = Candles.range(R.x2t(g.x0, g), R.x2t(g.x1, g));
    let out = "candle_time_ny,candle_start_ms,price,sell_aggressor_vol,buy_aggressor_vol,delta\n";
    for (const c of cs) for (const [r, [b, a]] of [...c.rows].sort((x, y) => x[0] - y[0])) out += `${fmtTime(c.t, true)},${c.t},${(r * Candles.row + S.displayOffset).toFixed(2)},${b.toFixed(4)},${a.toFixed(4)},${(a - b).toFixed(4)}\n`;
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([out], { type: "text/csv" })); a.download = "aegis_footprint.csv"; a.click();
  },
  help() {
    $("card").innerHTML = `<h2>HOW THIS WORKS</h2>
      <p><b>Data.</b> Spot gold (OANDA XAUUSD) is traded over the counter, so it has no public tape of who bought and who sold. This terminal reads free public websockets from crypto exchanges that list gold contracts and stamp every trade with its aggressor side:</p>
      <ul><li><b>Binance XAUUSDT</b>: USDT-settled gold perpetual (primary, deepest).</li><li><b>Hyperliquid xyz:GOLD</b>: on-chain gold perpetual.</li><li><b>Bybit XAUTUSDT / OKX XAUT-USDT-SWAP</b>: perpetuals on the tokenized gold token XAUT.</li><li><b>Kraken PAXG/USD</b>: spot tokenized gold (thin).</li></ul>
      <p>Prices of the other venues are shifted onto the primary venue's price using a live basis (shown next to each feed), so their volume lands on the right rows. Use <b>⚙ → price offset</b> to line the axis up with your TradingView / OANDA chart.</p>
      <p><b>Accuracy.</b> Every trade's buy/sell side comes from the exchange itself (not guessed from candles), the book is the exchange's real resting liquidity, and trades are stored locally so history builds up. What it is <i>not</i>: CME gold futures order flow. Crypto-venue gold volume is real money but a different crowd, so treat it as a strong proxy.</p>
      <h4>Who is in control? (read it in this order)</h4>
      <ol>
      <li><b>Delta under each candle (Δ).</b> Buy volume minus sell volume for that candle. Green candle + positive Δ = buyers pushed it and won. Price up but Δ negative = buyers are not really behind the move (weak). Price down but Δ positive = sellers are getting absorbed.</li>
      <li><b>CVD pane.</b> Running total of delta. CVD rising with price = healthy buying. New price high but CVD lower = buyers running out (divergence) — a classic top warning. Mirror for lows.</li>
      <li><b>Footprint cells.</b> Left number = sold into the bid, right = bought from the ask. Bright green bold numbers stacked 3+ high = buyers sweeping several prices in a row (they took control there). Bold red stacks = sellers took control. Gold box = where most volume traded in that candle (POC).</li>
      <li><b>At the extreme of a candle.</b> Huge red numbers at the low but the candle closes up = sellers dumped into a buyer who absorbed it (absorption → bullish). Tiny numbers at the very high = nobody left to buy up there (exhaustion → bearish).</li>
      <li><b>Heatmap + bubbles.</b> Bright band = big resting limit orders (a wall). Big red bubbles hitting a bright bid wall while price stops falling = absorption. Wall disappears just before price reaches it = it was pulled (fake). Price eats through the wall with big bubbles = that side took control.</li>
      </ol>
      <h4>Your levels</h4>
      <p>Tap <b>+ add / paste</b> in the Your levels panel and paste your Aegis levels, one per line (<code>long 4120.50 Aegis L1</code>, <code>short 4146.20 Aegis S1</code>). They're drawn across the chart and the panel shows live what the flow is doing at each one. A long at a level looks like: price reaches it → red sell bubbles/numbers hit it but price stops falling → the next candle prints positive Δ with price rising. Positive Δ while price is NOT rising means a seller is absorbing the buyers — that is not buyers in control.</p>
      <h4>Phone / tablet</h4>
      <p>Drag = pan · pinch sideways = zoom time · pinch up/down = zoom price · double-tap = back to live · use the + / − buttons on the chart · ☰ opens the panels.</p>
      <h4>Controls</h4>
      <p><b>PC / Mac (like TradingView):</b> drag the <b>price scale</b> up/down to stretch/squeeze vertically · drag the <b>time scale</b> left/right to squeeze/stretch horizontally · wheel (or trackpad pinch) = zoom time · Shift+wheel or wheel over the price scale = zoom price · drag the chart = pan · trackpad sideways swipe = scroll time · double-click price scale = AUTO · double-click time scale = reset width · double-click chart or Space = back to live · keys: + / − zoom, ↑ / ↓ stretch price, ← / → scroll, A = auto, F / H / B = footprint / heatmap / both.</p>
      <div class="row"><button class="btn" onclick="document.getElementById('modal').classList.remove('on')">Got it</button></div>`;
    $("modal").classList.add("on");
  },
};

// ─────────────────────────────── boot
let snapTimer = null;
function restartSnap() { if (snapTimer) clearInterval(snapTimer); snapTimer = setInterval(() => Hub.snapshot(), clamp(S.snapMs, 100, 5000)); }
async function boot() {
  UI.init(); R.layout();
  R.view.msPerPx = clamp(S.tf / clamp(R.W / 7, 45, 120), 20, 60000);
  await Persist.init();
  for (const k of PRIORITY) if (S.venues[k]) FEEDS[k].start();
  restartSnap();
  let lastF = 0;
  const loop = (ts) => { if (ts - lastF >= 40) { lastF = ts; try { R.frame(); } catch (e) { console.error(e); } } requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  setInterval(() => { R.dirty = true; UI.venuesDirty = true; }, 1000);
  window.addEventListener("beforeunload", () => Persist.flush());
}
boot();
</script>
